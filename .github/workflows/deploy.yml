name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rollback: Commit-SHA oder Tag, der ausgeliefert werden soll (leer = aktueller Stand von main)'
        required: false
        default: ''

# 'true' veröffentlicht die App, alles andere nur eine "Bald wieder da"-Seite.
env:
  SITE_ONLINE: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Nothing goes live without the full CI: lint, types, unit, rules, build, E2E, CSP
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Offline-Seite statt App veröffentlichen
        if: env.SITE_ONLINE != 'true'
        run: rm -rf dist && mkdir dist && cp .github/offline/index.html dist/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

  # Firestore rules + indexes, strictly AFTER the new client is live (older
  # clients would be rejected by stricter rules). Runs only when the app is
  # online and a service account is configured as a repository secret
  # FIREBASE_SERVICE_ACCOUNT (roles: Firebase Rules Admin, Cloud Datastore Index Admin).
  deploy-firestore:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        if: env.SITE_ONLINE == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        if: env.SITE_ONLINE == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: env.SITE_ONLINE == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          distribution: temurin
          java-version: 21
      - if: env.SITE_ONLINE == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npm ci && npm run test:rules
      - name: Deploy rules and indexes
        if: env.SITE_ONLINE == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only firestore:rules,firestore:indexes --project brew-country --non-interactive
